<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container bg-dark text-white p-5">
        <div class="carousel slide" id="flowers">
            <div class="carousel-indicators">
                <button data-bs-slide-to="0" data-bs-target="#flowers" class="active"></button>
                <button data-bs-slide-to="1" data-bs-target="#flowers"></button>
                <button data-bs-slide-to="2" data-bs-target="#flowers"></button>
                <button data-bs-slide-to="3" data-bs-target="#flowers"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active" >
                    <img class="d-block w-80" src="./download.jpg" alt="Flower">
                </div>
                <div class="carousel-item">
                    <img class="d-block  w-100 "  src="./download.jpg" class="d-block">
                </div>
                <div class="carousel-item">
                    <img class="d-block  w-100 " src="./download.jpg" class="d-block">
                </div>
                <div class="carousel-item">
                    <img class="d-block  w-100 " src="./download.jpg" class="d-block">
                </div>
            </div>
            <button class="carousel-control-prev " data-bs-target="#flowers" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" data-bs-target="#flowers" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </div>



        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>

</html>
