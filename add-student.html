<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
</head>
<body>
    <h1>Add Student</h1>
    <form action="./view-students.html" method="get">
        <input type="text" name="name" placeholder="Enter student's name" required><br><br>
        <input type="text" name="rollno" placeholder="Enter student's roll number" required><br><br>
        <input type="number" name="cgpa" placeholder="Enter student's CGPA" required><br><br>
        <select name="branch" required>
            <option value="">Select branch</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Electrical Engineering">Electrical Engineering</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
            <option value="Civil Engineering">Civil Engineering</option>
        </select><br><br>
        <button type="submit" value="Add Student">Add Student</button>
    </form>
</body>
</html>
