<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
</head>
<body>

    <h1>Weather Forecast</h1>

    <form onsubmit="fetchWeather(event)">
        <input type="text" id="city" placeholder="Enter City">
        <button type="submit">Search</button>
    </form>

    <br>

    <div id="res">
        <div id="day1"></div>
        <div id="day2"></div>
        <div id="day3"></div>
        <div id="day4"></div>
        <div id="day5"></div>
    </div>

    <script>
        async function fetchWeather(event) {
            event.preventDefault();

            const city = document.getElementById('city').value.trim();

            if (!city) {
                alert('Enter City Name');
                return;
            }

            try {
                const res = await fetch(
                    `http://api.weatherapi.com/v1/forecast.json?key=c16e57bc9db043b2a0e104719260803&q=${city}&days=5&aqi=no&alerts=no`
                );

                const data = await res.json();

                if (data.error) {
                    alert(data.error.message);
                    return;
                }

                const forecastdetails = data.forecast.forecastday;

                forecastdetails.forEach((day, index) => {
                    document.getElementById(`day${index + 1}`).innerHTML = `
                        <h3>Day ${index + 1}</h3>
                        <p><strong>Date:</strong> ${day.date}</p>
                        <p><strong>Min Temp:</strong> ${day.day.mintemp_c} °C</p>
                        <p><strong>Max Temp:</strong> ${day.day.maxtemp_c} °C</p>
                        <p><strong>Condition:</strong> ${day.day.condition.text}</p>
                        <hr>
                    `;
                });

            } catch (error) {
                console.error(error);
                alert('Failed to fetch weather data');
            }
        }
    </script>

</body>
</html>
