<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./CSS/styles.css">
</head>
<body>
    <nav class="navbar">
        
        <img src="./images/logo.jpg" alt="Logo" class="logo" width="50px" height="40px" style="border-radius: 50%;">
        <a href="./index.html">Home</a>
        <a href="./login.html">Login</a>
        <a href="./register.html">Register</a>
    </nav>
    <h1>Login Page</h1>
    <form action="./dashboard.html" method="get">
        <label for="username">Username:</label></br>
        <input type="text" name="username" placeholder="Enter your username" required id="username"></br>
        <label for="password">Password:</label></br>
        <input type="password" name="password" placeholder="Enter your password" required id="password"></br>
        <input type="submit" onclick="validateLogin(event)" value="Login">
    </form>

    <script>
        function validateLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const userData = JSON.parse(localStorage.getItem('userData'));

            if(userData && userData.username === username && userData.password === password) {
                window.location.href = './dashboard.html';
            } else {
                alert("Invalid username or password!");
            }
        }
    </script>
</body>
</html>
