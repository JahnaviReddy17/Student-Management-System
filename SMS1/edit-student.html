<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link rel="stylesheet" href="./CSS/styles.css">
</head>
<body>

<nav class="navbar">

    <img src="./images/logo.jpg"
         alt="Logo"
         width="50"
         height="40"
         style="border-radius:50%;">

    <a href="./add-student.html">Add Student</a>
    <a href="./view-students.html">View Students</a>
    <a href="./logout.html">Logout</a>

</nav>

<h1>Edit Student</h1>

<form id="edit-student-form">

    <label for="name">Name:</label><br>
    <input type="text"
           id="name"
           name="name"
           required>
    <br><br>

    <label for="rollno">Roll Number:</label><br>
    <input type="text"
           id="rollno"
           name="rollno"
           required>
    <br><br>

    <label for="cgpa">CGPA:</label><br>
    <input type="number"
           id="cgpa"
           name="cgpa"
           min="0"
           max="10"
           step="0.01"
           required>
    <br><br>

    <label for="branch">Branch:</label><br>
    <select id="branch"
            name="branch"
            required>

        <option value="">Select branch</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Electrical Engineering">Electrical Engineering</option>
        <option value="Mechanical Engineering">Mechanical Engineering</option>
        <option value="Civil Engineering">Civil Engineering</option>

    </select>

    <br><br>

    <button type="submit">
        Update Student
    </button>

</form>

<script>
async function loadStudentData() {

    const urlParams =
        new URLSearchParams(window.location.search);

    const id = urlParams.get("id");

    try {

        const response =
            await fetch(
                `http://localhost:3000/students/${id}`
            );

        const student =
            await response.json();

        document.getElementById("name").value =
            student.name;

        document.getElementById("rollno").value =
            student.rollno;

        document.getElementById("cgpa").value =
            student.cgpa;

        document.getElementById("branch").value =
            student.branch;

    } catch (error) {

        console.error(error);
        alert("Error loading student");
    }

    document.getElementById("edit-student-form")
        .addEventListener("submit",
            async function(event) {

        event.preventDefault();

        const updatedStudent = {

            name:
                document.getElementById("name").value,

            rollno:
                document.getElementById("rollno").value,

            cgpa:
                document.getElementById("cgpa").value,

            branch:
                document.getElementById("branch").value
        };

        try {

            const response =
                await fetch(
                    `http://localhost:3000/students/${id}`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify(updatedStudent)
                    }
                );

            if (!response.ok) {
                throw new Error();
            }

            alert("Student updated successfully!");

            window.location.href =
                "./view-students.html";

        } catch (error) {

            console.error(error);
            alert("Error updating student");
        }
    });
}

window.onload = loadStudentData;
</script>

</body>
</html>
