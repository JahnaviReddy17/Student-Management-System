<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link rel="stylesheet" href="./CSS/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
    <nav class="navbar">
        <img src="./images/logo.jpg" alt="Logo" class="logo" width="50" height="40" style="border-radius: 50%;">

        <a href="./add-student.html">Add Student</a>
        <a href="./view-students.html">View Students</a>
        <a href="./logout.html">Logout</a>
    </nav>

    <h1>Edit Student</h1>

    <form id="edit-student-form">
        <label for="name">Name:</label><br>
        <input type="text" name="name" placeholder="Enter student's name" required id="name">
        <br><br>

        <label for="rollno">Roll Number:</label><br>
        <input type="text" name="rollno" placeholder="Enter student's roll number" required id="rollno">
        <br><br>

        <label for="cgpa">CGPA:</label><br>
        <input type="number" name="cgpa" placeholder="Enter student's CGPA" min="0" max="10" step="0.01" required
            id="cgpa">
        <br><br>

        <label for="branch">Branch:</label><br>
        <select name="branch" required id="branch">
            <option value="">Select branch</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Electrical Engineering">Electrical Engineering</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
            <option value="Civil Engineering">Civil Engineering</option>
        </select>
        <br><br>

        <button type="submit" id="edit-student-button" onclick="modify(event)">
            Edit Student
        </button>
    </form>

    <script>


        var student = localStorage.getItem('editedStudent');
        if (student) {
            student = JSON.parse(student);
            document.getElementById('name').value = student.name;
            document.getElementById('rollno').value = student.rollno;
            document.getElementById('cgpa').value = student.cgpa;
            document.getElementById('branch').value = student.branch;
        }

        function modify(event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const rollno = document.getElementById('rollno').value.trim();
            const cgpa = document.getElementById('cgpa').value;
            const branch = document.getElementById('branch').value;

            const students = JSON.parse(localStorage.getItem('students')) || [];
            for (let i = 0; i < students.length; i++) {
                if (students[i].rollno === student.rollno) {
                    students[i].name = name;
                    students[i].rollno = rollno;
                    students[i].cgpa = cgpa;
                    students[i].branch = branch;
                    break;
                }
            }


            localStorage.setItem('students', JSON.stringify(students));
            localStorage.removeItem('editedStudent');

            alert("Student updated successfully!");
            window.location.href = "./view-students.html";
        }
