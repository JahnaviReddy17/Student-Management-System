```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link rel="stylesheet" href="./CSS/styles.css">
</head>
<body>
    <nav class="navbar">
        <img src="./images/logo.jpg" alt="Logo" class="logo"
             width="50" height="40" style="border-radius: 50%;">

        <a href="./add-student.html">Add Student</a>
        <a href="./view-students.html">View Students</a>
        <a href="./logout.html">Logout</a>
    </nav>

    <h1>Edit Student</h1>

    <form id="edit-student-form">
        <label for="name">Name:</label><br>
        <input type="text" name="name" placeholder="Enter student's name" required>
        <br><br>

        <label for="rollno">Roll Number:</label><br>
        <input type="text" name="rollno" placeholder="Enter student's roll number" required>
        <br><br>

        <label for="cgpa">CGPA:</label><br>
        <input type="number" name="cgpa" placeholder="Enter student's CGPA"
               min="0" max="10" step="0.01" required>
        <br><br>

        <label for="branch">Branch:</label><br>
        <select name="branch" required>
            <option value="">Select branch</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Electrical Engineering">Electrical Engineering</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
            <option value="Civil Engineering">Civil Engineering</option>
        </select>
        <br><br>

        <button type="submit" id="edit-student-button">
            Edit Student
        </button>
    </form>

    <script>
        function loadStudentData() {
            const urlParams = new URLSearchParams(window.location.search);
            const originalRollno = urlParams.get('rollno');

            const students = JSON.parse(localStorage.getItem('students')) || [];

            const student = students.find(
                s => s.rollno === originalRollno
            );

            if (!student) {
                alert("Student not found!");
                window.location.href = "./view-students.html";
                return;
            }

            document.querySelector('input[name="name"]').value = student.name;
            document.querySelector('input[name="rollno"]').value = student.rollno;
            document.querySelector('input[name="cgpa"]').value = student.cgpa;
            document.querySelector('select[name="branch"]').value = student.branch;

            document.getElementById('edit-student-form').addEventListener('submit', function (event) {
                event.preventDefault();

                const name = document.querySelector('input[name="name"]').value.trim();
                const rollno = document.querySelector('input[name="rollno"]').value.trim();
                const cgpa = document.querySelector('input[name="cgpa"]').value;
                const branch = document.querySelector('select[name="branch"]').value;

                // Check for duplicate roll number
                const duplicate = students.some(
                    s => s.rollno === rollno && s.rollno !== originalRollno
                );

                if (duplicate) {
                    alert("Roll number already exists!");
                    return;
                }

                const updatedStudent = {
                    name,
                    rollno,
                    cgpa,
                    branch
                };

                const updatedStudents = students.map(student =>
                    student.rollno === originalRollno
                        ? updatedStudent
                        : student
                );

                localStorage.setItem(
                    'students',
                    JSON.stringify(updatedStudents)
                );

                alert("Student updated successfully!");
                window.location.href = "./view-students.html";
            });
        }

        window.onload = loadStudentData;
    </script>
</body>
</html>
```
