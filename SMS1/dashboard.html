    <h1>Students</h1>
    
    <table id="students-table">
        <tr>
            <th>Name</th>
            <th>Roll Number</th>
            <th>CGPA</th>
            <th>Branch</th>
            <th>Actions</th>
        </tr>
        <tr>
            
        </tr>
    </table>
    <script>
        function loadStudents() {
            const students = JSON.parse(localStorage.getItem('students')) || [];
            const table = document.getElementById('students-table');
            students.forEach(student => {
                const row = table.insertRow();
                row.insertCell(0).innerText = student.name;
                row.insertCell(1).innerText = student.rollno;
                row.insertCell(2).innerText = student.cgpa;
                row.insertCell(3).innerText = student.branch;
                const actionsCell = row.insertCell(4);
                const editButton = document.createElement('button');
                editButton.innerText = 'Edit';
                editButton.onclick = () => editStudent(student);
                const deleteButton = document.createElement('button');
                deleteButton.innerText = 'Delete';
                deleteButton.onclick = () => deleteStudent(student);
                actionsCell.appendChild(editButton);
                editButton.style.margin = "0px 20px 0px 20px";
                actionsCell.appendChild(deleteButton);
            });
        }

        function editStudent(student) {
            //
        }

        function deleteStudent(student) {
            const students = JSON.parse(localStorage.getItem('students')) || [];
            const updatedStudents = students.filter(s => s.rollno !== student.rollno);
            localStorage.setItem('students', JSON.stringify(updatedStudents));
        }

        window.onload = loadStudents;
    </script>
</body>
