<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="./CSS/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar">

        <img src="./images/logo.jpg" alt="Logo" class="logo" width="50px" height="40px" style="border-radius: 50%;">
        <a href="./add-student.html">Add Student</a>
        <a href="./view-students.html">View Students</a>
        <a href="./logout.html">Logout</a>
    </nav>
    <h1>Add Student</h1>
    <form action="./view-students.html" method="get">
        <label for="name">Name:</label></br>
        <input type="text" name="name" id="name" placeholder="Enter student's name" required></br>
        <label for="rollno">Roll Number:</label></br>
        <input type="text" name="rollno" id="rollno" placeholder="Enter student's roll number" required></br>
        <label for="cgpa">CGPA:</label></br>
        <input type="number" name="cgpa" id="cgpa" placeholder="Enter student's CGPA" required></br>
        <label for="branch">Branch:</label></br>
        <select name="branch" id="branch" required style="width: 300px;height: 40px;">
            <option value="">Select branch</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Electrical Engineering">Electrical Engineering</option>
            <option value="Mechanical Engineering">Mechanical Engineering</option>
            <option value="Civil Engineering">Civil Engineering</option>
        </select></br></br>
        <button type="submit" onclick="addStudent(event)">Add Student</button>
    </form>
    <script>
        function addStudent(event) {
            event.preventDefault();  
            const name = document.getElementById('name').value;
            const rollno = document.getElementById('rollno').value;
            const cgpa = document.getElementById('cgpa').value;
            const branch = document.getElementById('branch').value;

            const student = { name, rollno, cgpa, branch };
            let students = JSON.parse(localStorage.getItem('students')) || [];
            students.push(student);
            localStorage.setItem('students', JSON.stringify(students));
            window.location.href = './view-students.html';
        }
    </script>
</body>

</html>
