<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5 & 6</title>
</head>
<style>
    .transition-btn{
    padding: 10px 20px;
    background-color: #3684d6;
    transition: all 0.5s ease;
}

.transition-btn:hover{
    background-color: #89e235;
    scale:1.1;
}

.student-card {
    column-count: 2;
    column-gap: 30px;
    column-rule: 1px solid black;
    border: 1px solid black;
    border-radius: 5px;
    padding: 20px;
    margin: 20px auto;
    width:500px;
    height : 150px;
    text-align: left;
    text-align: center;
    transition: all 0.3s ease-in-out;
}
.student-card:hover{
    width:600px;
    height:200px;
}
body{
    text-align: center;
    justify-content: center;
    align-items: center;
}

</style>
<body>
    
    <h1>Exercise 5</h1>
    <button class="transition-btn">Hover</button>
    <h1>Exercise 6</h1>
    <div class="student-cards-section">
        <div class="student-card">
            <p><img src="../images/student.jpg" width="150" height="100"></p>
            <p>Name: Jane Smith</p>
            <p>Branch: Electrical Engineering</p>
            <p>Email: jane.smith@example.com</p></p>

        </div>
    </div>

</body>
</html>
