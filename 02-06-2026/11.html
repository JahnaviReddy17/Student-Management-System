<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Text</title>
</head>
<style>
    .bouncing-text {
        font-size: 24px;
        color: aqua;
        animation: bounce 1s linear infinite;
    }

    @keyframes bounce {

        0% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(20px);
        }

        100% {
            transform: translateY(0);
        }
    }
</style>

<body>

    <h1>Exercise 11 Bouncing Text</h1>
    <h1 class="bouncing-text">WELCOME</h1>

</body>

</html>
