<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            font-size: 20px;
        }
        .product-card{
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            margin:auto;
            margin-top:100px;
            transition: transform 0.3s ease;
        }
        .product-card img:hover{
            transform: scale(1.2);

        }
        @media (max-width: 375px) {
            .product-card {
                width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="product-card">
        <img src="https://picsum.photos/150" alt="Product Image">
        <h2>Product Name</h2>
        <p>Product Description</p>
        <p>$19.99</p>
        <button class="login-submit-btn">Buy Now</button>
    </div>
</body>
</html>
